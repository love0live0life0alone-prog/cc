<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام إدارة العمال</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #273449;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-gray: #64748b;
            --accent-yellow: #f59e0b;
        }

        * { -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0; margin-bottom: 2rem;
        }

        .app-title {
            font-weight: 900;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .worker-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideIn 0.4s ease-out forwards;
            opacity: 0;
            height: 100%;
        }

        .worker-card:hover {
            background: var(--card-hover);
            border-color: var(--accent-blue);
            box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.2);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .worker-name-btn {
            background: none; border: none;
            font-weight: 700; color: var(--text-main);
            cursor: pointer; padding: 0;
            font-size: 1.2rem;
            white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
            max-width: 70%;
            transition: color 0.2s;
        }

        .worker-name-btn:hover { color: var(--accent-blue); }

        .header-actions { display: flex; gap: 0.5rem; }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 32px; height: 32px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }
        .icon-btn:hover { border-color: var(--text-muted); color: var(--text-main); }
        .icon-btn.delete-btn:hover { border-color: var(--accent-red); color: var(--accent-red); }
        .icon-btn svg { width: 16px; height: 16px; }

        .card-body-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pie-chart-container {
            position: relative; width: 90px; height: 90px; flex-shrink: 0;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            flex-grow: 1;
        }

        .actions-container { display: flex; gap: 8px; }

        .btn-action {
            width: 42px; height: 42px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border-color);
            background: transparent; color: var(--text-muted);
            cursor: pointer; transition: all 0.2s ease;
        }
        .btn-action:hover { border-color: currentColor; transform: scale(1.05); }
        .btn-action svg { width: 18px; height: 18px; }

        .active-present { background: var(--accent-green); border-color: var(--accent-green); color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .active-friday-work { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .active-friday-leave { background: var(--accent-gray); border-color: var(--accent-gray); color: #fff; box-shadow: 0 0 15px rgba(100, 116, 139, 0.4); }
        .active-absent { background: var(--accent-red); border-color: var(--accent-red); color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

        .attendance-count {
            font-size: 0.9rem; color: var(--text-muted); font-weight: 600;
            background: rgba(15, 23, 42, 0.5);
            padding: 4px 12px; border-radius: 20px;
        }

        .form-control, .form-control:focus, .form-select {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            color: var(--text-main); border-radius: 10px; box-shadow: none;
        }
        .form-control::placeholder { color: #64748b; opacity: 0.8; }
        .form-control:focus { border-color: var(--accent-blue); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.7; cursor: pointer; }
        .form-select option { background: var(--bg-dark); }

        .btn-primary { background: var(--accent-blue); border: none; border-radius: 10px; font-weight: 600; }
        .btn-primary:hover { background: #2563eb; }
        .btn-outline-secondary { border-color: var(--border-color); color: var(--text-muted); border-radius: 10px; }
        .btn-outline-secondary:hover { background: var(--card-bg); border-color: var(--text-muted); color: var(--text-main); }

        .view { display: none; }
        .active-view { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content { background-color: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 16px; }
        .modal-header { border-bottom: 1px solid var(--border-color); }
        .modal-footer { border-top: 1px solid var(--border-color); }
        .btn-close { filter: invert(1) grayscale(100%) brightness(200%); }

        /* تنسيقات العناوين داخل الإعدادات */
        .setting-label {
            display: block;
            color: var(--text-main);
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 0.4rem;
        }
        .setting-label small {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.8rem;
        }

        /* تنسيقات شاشة المرتب */
        .salary-box {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .salary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
        }
        .text-success { color: var(--accent-green) !important; }
        .text-danger { color: var(--accent-red) !important; }
        .text-warning { color: var(--accent-yellow) !important; }
        
        .total-salary-box {
            background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="app-header">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h3 class="app-title">إدارة العمال</h3>
            <div class="d-flex gap-2">
                <input type="date" id="currentDate" class="form-control" onchange="renderApp()">
                <button class="btn btn-outline-secondary" onclick="openSettings()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
        </div>
    </div>
</div>

<div class="container pb-5">
    <div id="attendanceView" class="active-view">
        <div class="card mb-4" style="background: var(--card-bg); border: 1px solid var(--border-color);">
            <div class="card-body d-flex gap-2">
                <input type="text" id="workerNameInput" class="form-control" placeholder="إضافة عامل جديد...">
                <button class="btn btn-primary" onclick="addWorker()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
        </div>
        <div id="workersList" class="row g-3"></div>
    </div>

    <div id="salaryView" class="view">
        <button class="btn btn-outline-secondary mb-4" onclick="switchView('attendanceView')">← رجوع للقائمة</button>
        <div id="salaryDetails" style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem;"></div>
    </div>
</div>

<!-- نافذة الإعدادات المتقدمة -->
<div class="modal fade" id="settingsModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">الإعدادات المالية</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- إعدادات عامة -->
                <h6 class="text-primary mb-3">إعدادات عامة (تطبق على جميع العمال)</h6>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="setting-label">يومية الحضور <small>(للشهر الحالي)</small></label>
                        <input type="number" id="baseRateInput" class="form-control" placeholder="مثال: 165">
                    </div>
                    <div class="col-md-4">
                        <label class="setting-label">يومية البدل <small>(للشهر السابق)</small></label>
                        <input type="number" id="replacementRateInput" class="form-control" placeholder="مثال: 100">
                    </div>
                    <div class="col-md-4">
                        <label class="setting-label">التأمينات <small>(مبلغ ثابت يُخصم)</small></label>
                        <input type="number" id="insuranceInput" class="form-control" placeholder="مثال: 500">
                    </div>
                    <div class="col-md-4">
                        <label class="setting-label">الضرائب <small>(نسبة % تُخصم)</small></label>
                        <input type="number" id="taxInput" class="form-control" placeholder="مثال: 5">
                    </div>
                    <div class="col-md-4">
                        <label class="setting-label">الحافز العام <small>(يُضاف للجميع)</small></label>
                        <input type="number" id="globalIncentiveInput" class="form-control" placeholder="مثال: 200">
                    </div>
                </div>

                <hr style="border-color: var(--border-color);">

                <!-- إعدادات فردية -->
                <h6 class="text-success mb-3">إعدادات فردية (لكل عامل على حدة)</h6>
                <div class="mb-3">
                    <label class="setting-label">اختر العامل لتعديل بياناته</label>
                    <select class="form-select" id="workerSelectSettings" onchange="loadWorkerSettings()">
                        <option value="">-- اختر عامل من القائمة --</option>
                    </select>
                </div>

                <div id="workerSettingsFields" style="display: none;">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="setting-label">بدل مواصلات <small>(يُضاف للعامل)</small></label>
                            <input type="number" id="transportInput" class="form-control" placeholder="مثال: 300">
                        </div>
                        <div class="col-md-4">
                            <label class="setting-label">حافز خاص / مكافأة <small>(يُضاف للعامل)</small></label>
                            <input type="number" id="specialIncentiveInput" class="form-control" placeholder="مثال: 150">
                        </div>
                        <div class="col-md-4">
                            <label class="setting-label">خصم / غرامة <small>(يُخصم من العامل)</small></label>
                            <input type="number" id="deductionInput" class="form-control" placeholder="مثال: 50">
                        </div>
                        <div class="col-12 mt-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="applyGlobalIncentiveCheck" style="background-color: var(--accent-green); border-color: var(--accent-green);">
                                <label class="form-check-label text-muted" for="applyGlobalIncentiveCheck">صرف الحافز الإضافي العام لهذا العامل</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="saveSettings()">حفظ الإعدادات</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const icons = {
        present: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
        friday_work: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
        friday_leave: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>',
        absent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>',
        edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>',
        delete: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>'
    };

    let db = { 
        workers: [], 
        attendance: {}, 
        settings: { baseRate: 165, replacementRate: 100, insurance: 0, taxRate: 0, globalIncentive: 0 } 
    };

    function loadDB() {
        const saved = localStorage.getItem('workers_db_v5'); // تغيير النسخة لحفظ التحديثات
        if (saved) db = JSON.parse(saved);
    }
    function saveDB() { localStorage.setItem('workers_db_v5', JSON.stringify(db)); }

    function getDateString() { return document.getElementById('currentDate').value; }
    function getCurrentMonth() {
        const dateStr = getDateString();
        return dateStr ? dateStr.substring(0, 7) : new Date().toISOString().substring(0, 7);
    }
    function getDaysInMonth(monthStr) {
        const [year, month] = monthStr.split('-').map(Number);
        return new Date(year, month, 0).getDate();
    }
    function getPreviousMonth(monthStr) {
        const [year, month] = monthStr.split('-').map(Number);
        const d = new Date(year, month - 2, 1);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function addWorker() {
        const name = document.getElementById('workerNameInput').value.trim();
        if (!name) return;
        db.workers.push({ 
            id: Date.now().toString(), 
            name: name,
            transport: 0,
            specialIncentive: 0,
            deduction: 0,
            applyGlobalIncentive: true
        });
        db.workers.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
        document.getElementById('workerNameInput').value = '';
        saveDB();
        renderApp();
    }

    function editWorker(id) {
        const worker = db.workers.find(w => w.id === id);
        if (!worker) return;
        const newName = prompt("تعديل اسم العامل:", worker.name);
        if (newName && newName.trim() !== "") {
            worker.name = newName.trim();
            db.workers.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
            saveDB();
            renderApp();
        }
    }

    function deleteWorker(id) {
        if (!confirm("هل أنت متأكد من حذف هذا العامل وكل سجلاته؟")) return;
        db.workers = db.workers.filter(w => w.id !== id);
        Object.keys(db.attendance).forEach(date => {
            if (db.attendance[date][id]) delete db.attendance[date][id];
        });
        saveDB();
        renderApp();
    }

    function markAttendance(workerId, status) {
        const dateStr = getDateString();
        if (!dateStr) return alert('اختر التاريخ أولاً');
        if (!db.attendance[dateStr]) db.attendance[dateStr] = {};
        
        const current = db.attendance[dateStr][workerId];
        const dayNumber = parseInt(dateStr.split('-')[2]);
        
        if (current && current.status === status) {
            delete db.attendance[dateStr][workerId];
        } else {
            if (status === 'friday_work') {
                db.attendance[dateStr][workerId] = { status: status, day: dayNumber };
            } else {
                db.attendance[dateStr][workerId] = { status: status };
            }
        }
        saveDB();
        renderApp();
    }

    function generatePieChart(workerId) {
        const monthStr = getCurrentMonth();
        const daysInMonth = getDaysInMonth(monthStr);
        const [year, month] = monthStr.split('-').map(Number);
        
        let slices = '';
        let countPresent = 0;
        
        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const att = db.attendance[dateStr]?.[workerId];
            
            let color = '#334155';
            let text = '';
            
            if (att) {
                if (att.status === 'present') { color = '#10b981'; countPresent++; }
                if (att.status === 'friday_leave') { color = '#64748b'; countPresent++; }
                if (att.status === 'friday_work') { color = '#3b82f6'; countPresent++; text = att.day; }
                if (att.status === 'absent') { color = '#ef4444'; }
            }
            
            const startAngle = ((day - 1) / daysInMonth) * 360;
            const endAngle = (day / daysInMonth) * 360;
            const r = 40, cx = 50, cy = 50;
            const x1 = cx + r * Math.cos(Math.PI * (startAngle - 90) / 180);
            const y1 = cy + r * Math.sin(Math.PI * (startAngle - 90) / 180);
            const x2 = cx + r * Math.cos(Math.PI * (endAngle - 90) / 180);
            const y2 = cy + r * Math.sin(Math.PI * (endAngle - 90) / 180);
            const largeArc = endAngle - startAngle > 180 ? 1 : 0;
            
            slices += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z" fill="${color}" stroke="#1e293b" stroke-width="1" />`;
            
            if (text) {
                const midAngle = (startAngle + endAngle) / 2;
                const tx = cx + (r * 0.65) * Math.cos(Math.PI * (midAngle - 90) / 180);
                const ty = cy + (r * 0.65) * Math.sin(Math.PI * (midAngle - 90) / 180);
                slices += `<text x="${tx}" y="${ty}" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle" alignment-baseline="middle">${text}</text>`;
            }
        }
        
        const svg = `<svg width="90" height="90" viewBox="0 0 100 100">${slices}<circle cx="50" cy="50" r="18" fill="#1e293b"/><text x="50" y="52" font-size="16" font-weight="900" fill="#f1f5f9" text-anchor="middle" alignment-baseline="middle">${countPresent}</text></svg>`;
        return svg;
    }

    function renderApp() {
        const list = document.getElementById('workersList');
        list.innerHTML = '';
        const dateStr = getDateString();
        const todayAtt = db.attendance[dateStr] || {};
        
        if (db.workers.length === 0) {
            list.innerHTML = '<div class="col-12 text-center text-muted py-5">لا يوجد عمال. أضف عاملاً جديداً للبدء.</div>';
            return;
        }
        
        db.workers.forEach((worker, index) => {
            const att = todayAtt[worker.id];
            const status = att ? att.status : null;
            const svg = generatePieChart(worker.id);
            
            const card = document.createElement('div');
            card.className = 'col-md-6 col-lg-4';
            card.style.animationDelay = `${index * 0.05}s`;
            card.innerHTML = `
                <div class="worker-card">
                    <div class="card-header-custom">
                        <button class="worker-name-btn" onclick="showSalary('${worker.id}')">${worker.name}</button>
                        <div class="header-actions">
                            <button class="icon-btn" onclick="editWorker('${worker.id}')" title="تعديل الاسم">${icons.edit}</button>
                            <button class="icon-btn delete-btn" onclick="deleteWorker('${worker.id}')" title="حذف العامل">${icons.delete}</button>
                        </div>
                    </div>
                    <div class="card-body-custom">
                        <div class="pie-chart-container">${svg}</div>
                        <div class="left-section">
                            <div class="actions-container">
                                <button class="btn-action ${status === 'present' ? 'active-present' : ''}" onclick="markAttendance('${worker.id}', 'present')" title="حاضر">${icons.present}</button>
                                <button class="btn-action ${status === 'friday_work' ? 'active-friday-work' : ''}" onclick="markAttendance('${worker.id}', 'friday_work')" title="نزل يوم الجمعة">${icons.friday_work}</button>
                                <button class="btn-action ${status === 'friday_leave' ? 'active-friday-leave' : ''}" onclick="markAttendance('${worker.id}', 'friday_leave')" title="إجازة جمعة">${icons.friday_leave}</button>
                                <button class="btn-action ${status === 'absent' ? 'active-absent' : ''}" onclick="markAttendance('${worker.id}', 'absent')" title="غياب">${icons.absent}</button>
                            </div>
                            <div class="attendance-count">إجمالي الحضور: ${getMonthlyCount(worker.id)} يوم</div>
                        </div>
                    </div>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function getMonthlyCount(workerId) {
        const monthStr = getCurrentMonth();
        const daysInMonth = getDaysInMonth(monthStr);
        const [year, month] = monthStr.split('-').map(Number);
        let count = 0;
        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const att = db.attendance[dateStr]?.[workerId];
            if (att && att.status !== 'absent') count++;
        }
        return count;
    }

    function switchView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active-view'));
        document.getElementById(viewId).classList.add('active-view');
        document.getElementById('attendanceView').style.display = viewId === 'attendanceView' ? 'block' : 'none';
    }

    function getMonthAttendance(workerId, monthStr) {
        const daysInMonth = getDaysInMonth(monthStr);
        const [year, month] = monthStr.split('-').map(Number);
        let counts = { present: 0, absent: 0, friday_work: 0, friday_leave: 0, total_attendance: 0 };
        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const att = db.attendance[dateStr]?.[workerId];
            if (att) {
                if (att.status === 'present') { counts.present++; counts.total_attendance++; }
                if (att.status === 'absent') counts.absent++;
                if (att.status === 'friday_work') { counts.friday_work++; counts.total_attendance++; }
                if (att.status === 'friday_leave') { counts.friday_leave++; counts.total_attendance++; }
            }
        }
        return counts;
    }

    function showSalary(workerId) {
        const worker = db.workers.find(w => w.id === workerId);
        const monthStr = getCurrentMonth();
        const prevMonthStr = getPreviousMonth(monthStr);
        
        const currentAtt = getMonthAttendance(workerId, monthStr);
        const prevAtt = getMonthAttendance(workerId, prevMonthStr);
        
        const currentBase = currentAtt.total_attendance * db.settings.baseRate;
        const prevReplacement = prevAtt.total_attendance * db.settings.replacementRate;
        
        const transport = worker.transport || 0;
        const specialIncentive = worker.specialIncentive || 0;
        const globalIncentive = worker.applyGlobalIncentive ? (db.settings.globalIncentive || 0) : 0;
        
        const insurance = db.settings.insurance || 0;
        const deduction = worker.deduction || 0;
        
        const netBeforeTax = currentBase + prevReplacement + transport + specialIncentive + globalIncentive - insurance - deduction;
        const tax = netBeforeTax * ((db.settings.taxRate || 0) / 100);
        const totalSalary = netBeforeTax - tax;
        
        const details = document.getElementById('salaryDetails');
        details.innerHTML = `
            <h3 class="mb-4" style="color: var(--accent-blue);">${worker.name}</h3>
            <div class="salary-box">
                <div class="salary-row text-success">
                    <span>أساسي (حضور الشهر الحالي ${currentAtt.total_attendance} يوم × ${db.settings.baseRate}):</span>
                    <span>${currentBase} جنيه</span>
                </div>
                <div class="salary-row text-success">
                    <span>بدل (حضور الشهر السابق ${prevAtt.total_attendance} يوم × ${db.settings.replacementRate}):</span>
                    <span>${prevReplacement} جنيه</span>
                </div>
                <div class="salary-row text-warning">
                    <span>بدل مواصلات:</span>
                    <span>${transport} جنيه</span>
                </div>
                <div class="salary-row text-warning">
                    <span>حافز خاص:</span>
                    <span>${specialIncentive} جنيه</span>
                </div>
                ${worker.applyGlobalIncentive ? `
                <div class="salary-row text-warning">
                    <span>حافز إضافي عام:</span>
                    <span>${globalIncentive} جنيه</span>
                </div>` : ''}
            </div>

            <div class="salary-box">
                <div class="salary-row text-danger">
                    <span>تأمينات:</span>
                    <span>- ${insurance} جنيه</span>
                </div>
                <div class="salary-row text-danger">
                    <span>خصم:</span>
                    <span>- ${deduction} جنيه</span>
                </div>
                <div class="salary-row text-danger">
                    <span>ضرائب (${db.settings.taxRate || 0}%):</span>
                    <span>- ${tax.toFixed(2)} جنيه</span>
                </div>
            </div>

            <div class="total-salary-box">
                <h4 class="mb-0" style="font-weight: 900;">إجمالي الصافي: ${totalSalary.toFixed(2)} جنيه</h4>
            </div>
        `;
        switchView('salaryView');
    }

    function openSettings() {
        document.getElementById('baseRateInput').value = db.settings.baseRate;
        document.getElementById('replacementRateInput').value = db.settings.replacementRate;
        document.getElementById('insuranceInput').value = db.settings.insurance;
        document.getElementById('taxInput').value = db.settings.taxRate;
        document.getElementById('globalIncentiveInput').value = db.settings.globalIncentive;
        
        const select = document.getElementById('workerSelectSettings');
        select.innerHTML = '<option value="">-- اختر عامل من القائمة --</option>';
        db.workers.forEach(w => {
            select.innerHTML += `<option value="${w.id}">${w.name}</option>`;
        });
        
        document.getElementById('workerSettingsFields').style.display = 'none';
        new bootstrap.Modal(document.getElementById('settingsModal')).show();
    }

    function loadWorkerSettings() {
        const id = document.getElementById('workerSelectSettings').value;
        const fields = document.getElementById('workerSettingsFields');
        if (!id) { fields.style.display = 'none'; return; }
        
        const worker = db.workers.find(w => w.id === id);
        if (!worker) return;
        
        fields.style.display = 'block';
        document.getElementById('transportInput').value = worker.transport || 0;
        document.getElementById('specialIncentiveInput').value = worker.specialIncentive || 0;
        document.getElementById('deductionInput').value = worker.deduction || 0;
        document.getElementById('applyGlobalIncentiveCheck').checked = worker.applyGlobalIncentive !== false;
    }

    function saveSettings() {
        db.settings.baseRate = parseFloat(document.getElementById('baseRateInput').value) || 0;
        db.settings.replacementRate = parseFloat(document.getElementById('replacementRateInput').value) || 0;
        db.settings.insurance = parseFloat(document.getElementById('insuranceInput').value) || 0;
        db.settings.taxRate = parseFloat(document.getElementById('taxInput').value) || 0;
        db.settings.globalIncentive = parseFloat(document.getElementById('globalIncentiveInput').value) || 0;
        
        const selectedWorkerId = document.getElementById('workerSelectSettings').value;
        if (selectedWorkerId) {
            const worker = db.workers.find(w => w.id === selectedWorkerId);
            if (worker) {
                worker.transport = parseFloat(document.getElementById('transportInput').value) || 0;
                worker.specialIncentive = parseFloat(document.getElementById('specialIncentiveInput').value) || 0;
                worker.deduction = parseFloat(document.getElementById('deductionInput').value) || 0;
                worker.applyGlobalIncentive = document.getElementById('applyGlobalIncentiveCheck').checked;
            }
        }
        
        saveDB();
        bootstrap.Modal.getInstance(document.getElementById('settingsModal')).hide();
    }

    function init() {
        loadDB();
        document.getElementById('currentDate').value = new Date().toISOString().split('T')[0];
        renderApp();
    }
    init();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('App Ready (Offline Mode)'))
        .catch(err => console.log('SW Failed', err));
    });
  }
</script>

</body>
